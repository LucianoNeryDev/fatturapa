name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pdf/package-lock.json
      - name: Install xmllint and pdftotext
        run: |
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends libxml2-utils poppler-utils curl
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:schema
      - run: npm run build
      # The PDF package depends on the built core through file:../..
      - name: PDF package
        working-directory: packages/pdf
        run: |
          npm ci
          npm run typecheck
          npm run format:check
          npm test
